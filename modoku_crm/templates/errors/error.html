{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height:60vh">
  <div class="display-4 fw-bold mb-2" style="color:var(--brand)">{{ code }}</div>
  <h4 class="mb-2">{{ heading }}</h4>
  <p class="text-muted mb-4" style="max-width:480px">{{ message }}</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-success"><i class="bi bi-house me-1"></i>Back to Dashboard</a>
</div>
{% endblock %}
{% block guest_content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height:100vh">
  <div class="display-4 fw-bold mb-2" style="color:var(--brand)">{{ code }}</div>
  <h4 class="mb-2">{{ heading }}</h4>
  <p class="text-muted mb-4" style="max-width:480px">{{ message }}</p>
  <a href="{{ url_for('auth.login') }}" class="btn btn-success"><i class="bi bi-box-arrow-in-right me-1"></i>Go to Login</a>
</div>
{% endblock %}
