{% extends "base.html" %}
{% block title %}Submitted{% endblock %}
{% block guest_content %}
<div class="auth-wrap">
  <div class="auth-bg-overlay" style="background:rgba(0,0,0,0.15)"></div>
  <div class="card auth-card p-4 shadow text-center">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Modoku" class="login-logo-sm mx-auto mb-2 d-block">
    <div class="mb-2"><i class="bi bi-check-circle-fill text-success" style="font-size:2.5rem"></i></div>
    <h5 class="fw-semibold mb-2">Thank you!</h5>
    <p class="small text-muted mb-0">
      Your signed JD14 Form for <strong>{{ s.course_title }}</strong> has been received. Our team will
      be in touch if anything else is needed.
    </p>
  </div>
</div>
{% endblock %}
