{% extends "base.html" %}
{% block title %}Verify it's you{% endblock %}
{% block guest_content %}
<div class="auth-wrap">
  <video class="auth-bg-video" autoplay muted loop playsinline>
    <source src="https://modoku.tech/wp-content/uploads/2026/08/modoku_2026_reels_home.mp4" type="video/mp4">
  </video>
  <div class="auth-bg-overlay"></div>
  <div class="card auth-card p-4 shadow">
    <div class="text-center mb-3">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Modoku" class="login-logo-sm mx-auto mb-2 d-block">
      <h4 class="login-title mb-0">Modoku Hub</h4>
      <p class="text-muted small mt-2 mb-0">We emailed you a 6-digit code. Enter it below to finish logging in.</p>
    </div>
    <form method="post">
      {{ csrf_field()|safe }}
      <div class="mb-3">
        <label class="form-label">Login code</label>
        <input type="text" name="code" class="form-control text-center" style="letter-spacing:.3em;font-size:1.3rem;"
               inputmode="numeric" pattern="[0-9]*" maxlength="6" required autofocus>
      </div>
      <button type="submit" class="btn btn-success w-100">Verify &amp; log in</button>
    </form>
    <form method="post" action="{{ url_for('auth.resend_code') }}" class="text-center mt-2">
      {{ csrf_field()|safe }}
      <button type="submit" class="btn btn-link btn-sm">Resend code</button>
    </form>
    <div class="text-center mt-1">
      <a href="{{ url_for('auth.login') }}" class="small text-muted">Cancel and start over</a>
    </div>
  </div>
</div>
{% endblock %}
