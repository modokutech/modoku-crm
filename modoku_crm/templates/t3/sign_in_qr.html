<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign-in QR · {{ s.course_title }}</title>
  {# Fix155: full-screen sign-in QR for the training-room screen. #}
  <style>
    @font-face { font-family: "Poppins"; font-weight: 400; src: url("{{ url_for('static', filename='fonts/Poppins-Regular.ttf') }}"); }
    @font-face { font-family: "Poppins"; font-weight: 700; src: url("{{ url_for('static', filename='fonts/Poppins-Bold.ttf') }}"); }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Poppins", Arial, sans-serif; color: #fff; text-align: center;
      background: #2e3192 url("{{ url_for('static', filename='img/modoku-bg-gradient.jpg') }}") center / cover no-repeat;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vh;
      padding: 3vh 4vw; box-sizing: border-box;
    }
    h1 { font-size: clamp(22px, 3.6vh, 44px); font-weight: 700; margin: 0; max-width: 1100px; line-height: 1.25; }
    .date { font-size: clamp(15px, 2.2vh, 26px); color: #d2d5eb; margin-top: -0.8vh; }
    .qr { background: #fff; border-radius: 22px; padding: 1.4vh; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
    .qr img { display: block; height: 58vh; width: 58vh; max-width: 80vw; max-height: 80vw; }
    .scan { font-size: clamp(20px, 3.4vh, 40px); font-weight: 700; margin: 0; }
    .hint { font-size: clamp(13px, 1.8vh, 20px); color: #d2d5eb; margin: -1.2vh 0 0; }
    .tools { position: fixed; top: 14px; right: 16px; display: flex; gap: 8px; }
    .tools a, .tools button {
      font: 600 13px "Poppins", Arial, sans-serif; color: #fff; background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 7px 14px; text-decoration: none; cursor: pointer;
    }
    .tools a:hover, .tools button:hover { background: rgba(255,255,255,.25); }
    .off { background: #fbaf17; color: #1b1b1b; border-radius: 10px; padding: 8px 16px; font-size: 15px; }
    @media print { .tools { display: none; } }
  </style>
</head>
<body>
  <div class="tools">
    <button type="button" onclick="document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()">Full screen</button>
    <a href="{{ url_for('t3.sign_in_qr_png', session_id=s.id, download=1) }}">Download PNG</a>
    <a href="{{ url_for('t3.manage', session_id=s.id) }}">Close</a>
  </div>
  <h1>{{ s.course_title }}</h1>
  <div class="date">{{ s.start_date|fmtdaterange(s.end_date) }}</div>
  <div class="qr"><img src="{{ url_for('t3.sign_in_qr_png', session_id=s.id) }}" alt="Sign-in QR code"></div>
  <p class="scan">Scan to sign your attendance</p>
  <p class="hint">Find your name on the list and tap Sign.</p>
</body>
</html>
