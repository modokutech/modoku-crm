# Modoku Hub: send anything that isn't https://hub.modoku.tech there.
#
# Covers the VPS's bare IP (http://152.42.226.86/..., https://152.42.226.86/...)
# and any stray hostname pointed at this server. Paths are kept, so an old
# emailed link like https://152.42.226.86/purchase-orders/3 lands on
# https://hub.modoku.tech/purchase-orders/3.
#
# hub.modoku.tech's own server block (made by certbot) matches by name and is
# untouched; these two blocks only catch requests that match no other name.
# Install: see deploy/nginx/README.md.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://hub.modoku.tech$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # hub.modoku.tech's certificate: it doesn't cover the IP, so a browser
    # opening https://152.42.226.86 still warns once before the redirect, but
    # old emailed IP links then reach the right place instead of failing.
    ssl_certificate     /etc/letsencrypt/live/hub.modoku.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.modoku.tech/privkey.pem;

    return 301 https://hub.modoku.tech$request_uri;
}
